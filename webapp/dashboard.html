<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dashboard Candidature Locale - Horeca Torino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #f5f5f5);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
      --border-color: rgba(255, 255, 255, 0.08);
      --gold-color: #fbc02d;
      --green-color: #4caf50;
      --red-color: #e53935;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
    }

    .header p {
      font-size: 13px;
      color: var(--hint-color);
      margin-top: 4px;
    }

    .cand-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }

    .cand-card.has-applied {
      border: 2px solid var(--green-color);
      background: rgba(76, 175, 80, 0.08);
    }

    .cand-card.is-premium {
      box-shadow: 0 2px 10px rgba(251, 192, 45, 0.15);
    }

    .cand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .cand-name {
      font-size: 15px;
      font-weight: 700;
    }

    .badges-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .badge-applied {
      background: var(--green-color);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .badge-prem {
      background: var(--gold-color);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .badge-base {
      background: rgba(255, 255, 255, 0.1);
      color: var(--hint-color);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .cand-info {
      font-size: 13px;
      color: var(--hint-color);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .screening-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      border-left: 3px solid var(--green-color);
    }

    .actions-grid {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      text-align: center;
      display: inline-block;
    }

    .btn-tg {
      background: var(--button-color);
    }

    .btn-call {
      background: #2e7d32;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint-color);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📋 Dashboard Candidature</h1>
    <p>Ordinate per priorità di candidatura e stato Premium</p>
  </div>

  <div id="candidatesList">
    <div class="empty-state">⏳ Caricamento candidati in corso...</div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('job_id') || '1';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    async function loadCandidates() {
      const container = document.getElementById('candidatesList');
      try {
        const resp = await fetch(`/api/get_employer_candidates?job_id=${encodeURIComponent(jobId)}`, {headers: {'X-Telegram-Init-Data': tg ? tg.initData : ''}});
        const data = await resp.json();

        if (!data.candidates || data.candidates.length === 0) {
          container.innerHTML = `<div class="empty-state">ℹ️ Nessun candidato registrato attualmente in target per questo annuncio.</div>`;
          return;
        }

        let html = '';
        data.candidates.forEach(c => {
          const hasApplied = c.application_status !== 'nessuna';
          const appliedBadge = hasApplied ? `<span class="badge-applied">📩 CANDIDATO (PRIORITÀ)</span>` : '';
          const premBadge = c.is_premium ? `<span class="badge-prem">⭐ PREMIUM</span>` : `<span class="badge-base">⚪ BASE</span>`;
          const firstName = escapeHtml(c.first_name);
          const username = escapeHtml(c.username);
          const phone = String(c.phone || '').replace(/[^+0-9 ]/g, '');
          const roles = Array.isArray(c.roles) ? c.roles.map(escapeHtml).join(', ') : '';
          const experience = escapeHtml(c.experience || 'N/D');
          const q1 = escapeHtml(c.screening_q1);
          const q2 = escapeHtml(c.screening_q2);
          const tgBtn = username ? `<a class="btn-action btn-tg" href="https://t.me/${encodeURIComponent(c.username)}" target="_blank" rel="noopener">💬 Telegram</a>` : '';
          const callBtn = phone ? `<a class="btn-action btn-call" href="tel:${encodeURIComponent(phone)}">📱 Chiama</a>` : '';

          html += `
            <div class="cand-card ${hasApplied ? 'has-applied' : ''} ${c.is_premium ? 'is-premium' : ''}">
              <div class="cand-header">
                <span class="cand-name">${firstName} ${username ? '(@' + username + ')' : ''}</span>
                <div class="badges-container">
                  ${appliedBadge}
                  ${premBadge}
                </div>
              </div>
              <div class="cand-info">
                💼 <b>Ruoli:</b> ${roles || 'Horeca'}<br>
                ⏳ <b>Esperienza:</b> ${experience}<br>
                🎯 <b>Affinità Match:</b> ${c.match_score}%
              </div>
              ${hasApplied ? `
              <div class="screening-box">
                <div><b>Pre-screening:</b> ${q1}</div>
                ${q2 ? `<div><b>Requisiti/HACCP:</b> ${q2}</div>` : ''}
              </div>` : ''}
              <div class="actions-grid">
                ${tgBtn}
                ${callBtn}
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch(e) {
        console.error(e);
        container.innerHTML = `<div class="empty-state">❌ Si è verificato un errore nel caricamento.</div>`;
      }
    }

    loadCandidates();
  </script>
</body>
</html>
